<VirtualHost *:80>
        ServerName processed_files
        ServerAlias *

        DocumentRoot /var/www/processed_files/

        Alias /dav/ /var/www/processed_files/
        Alias /file/ /var/www/processed_files/

        <Location /dav/>
                Dav On
                DavDepthInfinity On
                DavMinTimeout 300
                <RequireAny>
                        Require ip 10.0.0.0/8
                        Require ip 172.16.0.0/12
                        Require ip 192.168.0.0/16
                </RequireAny>
        </Location>

        <Location /file/>
                <LimitExcept GET OPTIONS HEAD>
                        Require all denied
                </LimitExcept>

                # Browser caching configuration
                ExpiresActive On

                ExpiresByType image/svg+xml "access plus 1 month"
                ExpiresByType image/jpg "access plus 1 month"
                ExpiresByType image/gif "access plus 1 month"
                ExpiresByType image/jpeg "access plus 1 month"
                ExpiresByType image/png "access plus 1 month"
                ExpiresByType image/webp "access plus 1 month"
                ExpiresByType image/ico "access plus 1 month"
                ExpiresByType image/x-icon "access plus 1 month"

                ExpiresByType text/css "access plus 1 month"
                ExpiresByType text/javascript "access plus 1 month"
                ExpiresByType application/javascript "access plus 1 month"

                ExpiresByType application/font-woff2 "access plus 1 month"
                ExpiresByType application/font-woff "access plus 1 month"
                ExpiresByType application/vnd.ms-fontobject "access plus 1 month"
                ExpiresByType application/font-sfnt "access plus 1 month"

                AddOutputFilter DEFLATE .svg

                # Mime types for not so common data formats.
                AddType application/font-woff2 .woff2
                AddType application/font-woff .woff
                AddType application/vnd.ms-fontobject .eot
                AddType application/font-sfnt .ttf
                AddType image/webp .webp
        </Location>
</VirtualHost>
